# Isolated test configuration. These values are public test fixtures, not credentials.
spring.datasource.url=jdbc:h2:mem:stocksprout;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-only-signing-key-not-for-production-0123456789
market-data.api-key=test-only-placeholder
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true

spring.application.name=stocksprout

# Required secrets and connection details are supplied externally.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Safe defaults for local development; override them in hosted environments.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

market-data.api-key=${MARKET_DATA_API_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Local HTTP uses false. Hosted HTTPS environments must set AUTH_COOKIE_SECURE=true.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Expose a status-only health endpoint. All other Actuator endpoints stay unavailable.
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true

# Application logs use Spring's logging system and can be tuned per environment.
logging.level.com.vampz.stocksprout=${APP_LOG_LEVEL:INFO}
